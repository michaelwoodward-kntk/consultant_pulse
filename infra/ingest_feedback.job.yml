resources:
  jobs:
    ingest_feedback:
      name: ingest_feedback
      description: Create or refresh the TPM feedback bronze table from sample rows

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../src/notebooks/ingest_feedback.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
